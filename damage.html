<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KAZUPON CARD ダメージ計算機</title>
<style>
:root{--gold:#f4c536;--gold2:#ffe68a;--line:#40586d;--muted:#aeb8c2;--blue:#69baff}
*{box-sizing:border-box} body{margin:0;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:radial-gradient(circle at top,#67100c 0,#220807 34%,#08090d 78%);min-height:100vh}
.wrap{max-width:650px;margin:auto;padding:16px 11px 36px}.title{text-align:center;font-weight:1000;font-size:28px;color:var(--gold2);text-shadow:0 2px 6px #000}.sub{text-align:center;font-weight:900;font-size:12px;margin:1px 0 12px}
.card{background:linear-gradient(135deg,#071a2a,#09283d);border:2px solid var(--gold);border-radius:18px;padding:14px;margin-bottom:13px;box-shadow:0 12px 35px #0008}
.sectionTitle{font-size:21px;font-weight:1000;color:var(--gold2);margin-bottom:8px}.attrTitle{font-size:13px;font-weight:900;margin:7px 0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.ab{border:2px solid var(--line);background:#071522;border-radius:13px;color:#fff;padding:5px 2px 6px;min-height:82px;font-weight:1000;cursor:pointer}.ab img{width:52px;height:52px;border-radius:50%;display:block;margin:auto;object-fit:cover}.ab.on1{border-color:#ffd21f;background:#4a3206;box-shadow:0 0 14px #ffd21fa8}.ab.on2{border-color:#55b8ff;background:#082c48;box-shadow:0 0 14px #55b8ff88}
.note{font-size:10px;color:var(--muted);line-height:1.5;margin:7px 0}.row{display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center;margin:10px 0}.label{font-weight:1000;color:var(--gold2)}.hint{display:block;color:#d6dde3;font-size:10px;font-weight:600;margin-top:2px}
input,select{width:100%;height:45px;border-radius:10px;border:2px solid var(--line);background:#071522;color:#fff;text-align:center;font-size:18px;font-weight:1000}
.status{max-width:360px;margin-top:9px}.status label{display:block;font-size:11px;font-weight:900;margin-bottom:4px}
.sec{font-weight:1000;color:var(--gold2);margin:12px 0 6px}.step{display:grid;grid-template-columns:52px 1fr 52px;gap:7px}.step button,.step div{height:43px;border:2px solid var(--line);background:#071522;color:#fff;border-radius:10px;font-size:22px;font-weight:1000}.step div{text-align:center;line-height:39px}
.match{text-align:center;background:#06121c;border:1px solid #6b5523;border-radius:13px;padding:12px}.mult{font-size:34px;font-weight:1000;color:var(--gold2)}.break{font-size:11px;color:var(--muted);margin-top:3px}.formula{text-align:center;background:#06121c;border:1px solid var(--line);border-radius:11px;padding:10px;margin-top:10px;font-size:12px;color:#cbd2d8;line-height:1.5}
.result{text-align:center;margin-top:11px;border:1px solid #733631;background:#351211;border-radius:14px;padding:14px}.damage{font-size:52px;font-weight:1000}.damage small{font-size:14px}.hp{border-top:1px solid #ffffff20;margin-top:8px;padding-top:9px;font-weight:900}.hp strong{font-size:27px;color:var(--blue)}
.reset{width:100%;height:44px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#071522;color:#ddd;font-weight:900}
@media(max-width:430px){.grid{grid-template-columns:repeat(4,1fr)}.row{grid-template-columns:1fr 120px}}
</style></head><body><div class="wrap">
<div class="title">KAZUPON CARD</div><div class="sub">ダメージ計算機 Ver.5</div>

<div class="card"><div class="sectionTitle">自分</div><div class="attrTitle">自分の属性（1つ選択）</div><div class="grid" id="mine"></div>
<div class="status"><label>自分の状態異常</label><select id="myStatus"></select></div>
<div class="row"><div class="label">攻撃力<span class="hint">キャラクターの基本攻撃力</span></div><input id="atk" type="number" value="15"></div>
<div class="sec">攻撃力補正（5刻み）</div><div class="step"><button data-k="atkMod" data-d="-5">−</button><div id="atkMod">±0</div><button data-k="atkMod" data-d="5">＋</button></div>
<div class="row"><div class="label">技の威力</div><input id="pow" type="number" value="15"></div>
<div class="sec">技威力補正（5刻み）</div><div class="step"><button data-k="powMod" data-d="-5">−</button><div id="powMod">±0</div><button data-k="powMod" data-d="5">＋</button></div></div>

<div class="card"><div class="sectionTitle">相手</div><div class="attrTitle">相手の属性（最大2つ選択）</div><div class="grid" id="enemy"></div>
<div class="note">1つ目は金枠、2つ目は青枠。1属性だけでもOK。複合属性は相性倍率を自動で重ねます。</div>
<div class="status"><label>相手の状態異常</label><select id="enemyStatus"></select></div>
<div class="row"><div class="label">防御力</div><input id="def" type="number" value="20"></div>
<div class="sec">防御力補正（5刻み）</div><div class="step"><button data-k="defMod" data-d="-5">−</button><div id="defMod">±0</div><button data-k="defMod" data-d="5">＋</button></div>
<div class="row"><div class="label">相手の生命力</div><input id="hp" type="number" value="100"></div></div>

<div class="card"><div class="sectionTitle">自動相性判定</div><div class="match"><div class="mult" id="mult">×1</div><div class="break" id="break">等倍</div></div>
<div class="note">◎＝×2　○＝×1.25　△＝×0.75　×＝無効</div><div class="formula" id="formula"></div>
<div class="result"><div>最終ダメージ</div><div class="damage"><span id="dmg">10</span><small> ダメージ</small></div><div class="hp">相手生命力　<span id="before">100</span> → <strong id="after">90</strong></div></div>
<button class="reset" id="reset">すべて初期値に戻す</button></div></div>

const statuses=["なし","火傷","獣傷","水傷","空傷"];
let my=0,en=[0],s={atkMod:0,powMod:0,defMod:0};
const $=x=>document.getElementById(x), n=x=>Number($(x).value)||0;
function buttons(){
 $("mine").innerHTML=names.map((x,i)=>`<button class="ab" data-i="${i}"><img src="${icons[i]}">${x}</button>`).join("");
 $("enemy").innerHTML=names.map((x,i)=>`<button class="ab" data-i="${i}"><img src="${icons[i]}">${x}</button>`).join("");
 document.querySelectorAll("#mine .ab").forEach(b=>b.onclick=()=>{my=+b.dataset.i;draw()});
 document.querySelectorAll("#enemy .ab").forEach(b=>b.onclick=()=>{
  let i=+b.dataset.i;
  if(en.includes(i)){ if(en.length===2) en=en.filter(x=>x!==i); }
  else if(en.length===1) en.push(i); else en=[en[0],i];
  draw();
 });
}
function f(v){return v===0?"±0":v>0?"+"+v:""+v}
function draw(){
 document.querySelectorAll("#mine .ab").forEach(b=>b.classList.toggle("on1",+b.dataset.i===my));
 document.querySelectorAll("#enemy .ab").forEach(b=>{b.classList.remove("on1","on2");if(en[0]===+b.dataset.i)b.classList.add("on1");if(en[1]===+b.dataset.i)b.classList.add("on2")});
 ["atkMod","powMod","defMod"].forEach(k=>$(k).textContent=f(s[k]));
 let m=1,p=[];en.forEach(e=>{let v=T[my][e];m*=v;let z=v===2?"◎":v===1.25?"○":v===.75?"△":v===0?"×":"－";p.push(`${names[my]}→${names[e]} ${z}${v===1?"":"×"+v}`)});
 let attackBase=Math.max(0,n("atk")+s.atkMod),P=Math.max(0,n("pow")+s.powMod),defenseBase=Math.max(0,n("def")+s.defMod);
 let myStatus=$("myStatus").value, enemyStatus=$("enemyStatus").value;
 let attackStatusMult=myStatus==="火傷"?0.5:myStatus==="獣傷"?0.5:1;
 let defenseStatusMult=enemyStatus==="水傷"?0.85:enemyStatus==="空傷"?0.9:1;

 // A＝（攻撃力＋バフ・デバフ）×攻撃側状態異常
 // 与えるダメージ＝（A＋技威力）×属性相性
 // B＝（防御力＋バフ・デバフ）×防御側状態異常
 // 最終ダメージ＝与えるダメージ−B
 let A=attackBase*attackStatusMult;
 let attackDamage=(A+P)*m;
 let B=defenseBase*defenseStatusMult;
 let rawDamage=attackDamage-B;
 let dmg=Math.max(0,Math.round(rawDamage)),hp=n("hp");
 $("mult").textContent="×"+(+m.toFixed(4)); $("break").textContent=p.join(" / "); $("dmg").textContent=dmg;$("before").textContent=hp;$("after").textContent=Math.max(0,hp-dmg);
 $("formula").innerHTML=`A＝（攻撃 ${attackBase}）×状態異常 ${attackStatusMult} ＝ <b>${+A.toFixed(2)}</b><br>（A ${+A.toFixed(2)} ＋ 技威力 ${P}）× 相性 ${+m.toFixed(4)} ＝ ${+attackDamage.toFixed(2)}<br>B＝（防御 ${defenseBase}）×状態異常 ${defenseStatusMult} ＝ ${+B.toFixed(2)}<br>最終ダメージ＝与えるダメージ−B ＝ <b>${dmg}</b><br>自分状態：${myStatus}　相手状態：${enemyStatus}`;
}
document.querySelectorAll(".step button").forEach(b=>b.onclick=()=>{s[b.dataset.k]+=+b.dataset.d;draw()});
["atk","pow","def","hp","myStatus","enemyStatus"].forEach(x=>{$(x).addEventListener("input",draw);$(x).addEventListener("change",draw)});
$("reset").onclick=()=>{my=0;en=[0];s={atkMod:0,powMod:0,defMod:0};$("atk").value=15;$("pow").value=15;$("def").value=20;$("hp").value=100;$("myStatus").value="なし";$("enemyStatus").value="なし";draw()};
["myStatus","enemyStatus"].forEach(id=>$(id).innerHTML=statuses.map(x=>`<option>${x}</option>`).join(""));
buttons();draw();
</script></body></html>
