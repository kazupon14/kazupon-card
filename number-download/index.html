<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かずぽん 番号シール ダウンロード</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #0a0a0a;
    color: #f5f5f5;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(10,10,10,.96);
    border-bottom: 1px solid #5f4810;
    padding: 18px 14px 14px;
    backdrop-filter: blur(8px);
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(22px, 5vw, 34px);
    color: #f2c84b;
    letter-spacing: .03em;
  }
  .sub {
    margin: 0 0 14px;
    font-size: 14px;
    color: #d2d2d2;
    line-height: 1.6;
  }
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  input {
    flex: 1 1 180px;
    min-width: 0;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid #65501b;
    background: #151515;
    color: white;
    font-size: 16px;
  }
  button.filter {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #65501b;
    background: #171717;
    color: #f4d56a;
    font-weight: 700;
  }
  main { padding: 18px 14px 40px; }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap: 12px;
  }
  .card {
    background: #111;
    border: 1px solid #2b2b2b;
    border-radius: 14px;
    padding: 10px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  .card img {
    width: 100%;
    height: 92px;
    object-fit: contain;
    display: block;
    margin: 0 auto 8px;
  }
  .num {
    font-weight: 800;
    color: #f1d16a;
    margin-bottom: 8px;
  }
  .download {
    display: block;
    text-decoration: none;
    background: linear-gradient(180deg, #d9b13c, #8f6d14);
    color: #0a0a0a;
    font-weight: 800;
    padding: 9px 8px;
    border-radius: 9px;
  }
  .download:active { transform: translateY(1px); }
  .note {
    max-width: 1100px;
    margin: 20px auto 0;
    color: #aaa;
    font-size: 12px;
    line-height: 1.7;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>かずぽん 番号シール</h1>
    <p class="sub">必要な番号を選んで「ダウンロード」を押してください。1枚ずつPNG画像で保存できます。</p>
    <div class="controls">
      <input id="search" inputmode="numeric" placeholder="番号を入力（例：128）" aria-label="番号検索">
      <button class="filter" data-range="all">すべて</button>
      <button class="filter" data-range="1">1桁</button>
      <button class="filter" data-range="2">2桁</button>
      <button class="filter" data-range="3">3桁</button>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="note">
    ※画像は番号ごとに個別ダウンロードされます。<br>
    ※1桁・2桁・3桁はそれぞれ同じ外枠サイズで統一しています。
  </div>
</main>

<script>
const grid = document.getElementById('grid');
const search = document.getElementById('search');
let activeRange = 'all';

function build() {
  for (let n = 1; n <= 160; n++) {
    const digits = String(n).length;
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.num = n;
    card.dataset.digits = digits;
    card.innerHTML = `
      <img src="numbers/${n}.png" alt="番号 ${n}">
      <div class="num">No. ${n}</div>
      <a class="download" href="numbers/${n}.png" download="kazupon-number-${n}.png">ダウンロード</a>
    `;
    grid.appendChild(card);
  }
}

function applyFilter() {
  const q = search.value.trim();
  document.querySelectorAll('.card').forEach(card => {
    const num = card.dataset.num;
    const digits = card.dataset.digits;
    const matchText = !q || num.includes(q);
    const matchRange = activeRange === 'all' || digits === activeRange;
    card.classList.toggle('hidden', !(matchText && matchRange));
  });
}

search.addEventListener('input', applyFilter);
document.querySelectorAll('.filter').forEach(btn => {
  btn.addEventListener('click', () => {
    activeRange = btn.dataset.range;
    applyFilter();
  });
});

build();
</script>
</body>
</html>
