<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かずぽん 番号シール ダウンロード</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#090909;color:#fff}
header{position:sticky;top:0;z-index:10;background:rgba(9,9,9,.96);border-bottom:1px solid #5f4810;padding:18px 14px}
.wrap,.grid,.note{max-width:1100px;margin:auto}
h1{margin:0 0 8px;color:#f2c84b;font-size:clamp(22px,5vw,34px)}
.sub{margin:0 0 12px;color:#d2d2d2;line-height:1.6}
.all-download{display:block;text-align:center;text-decoration:none;background:linear-gradient(#f0cf65,#9a7416);color:#080808;font-weight:900;padding:14px;border-radius:11px;margin:0 0 12px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 180px;padding:11px;border-radius:10px;border:1px solid #65501b;background:#151515;color:#fff;font-size:16px}
button{padding:10px 12px;border-radius:10px;border:1px solid #65501b;background:#171717;color:#f4d56a;font-weight:700}
main{padding:18px 14px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.card{background:#111;border:1px solid #2b2b2b;border-radius:14px;padding:10px;text-align:center}
.card img{width:100%;height:92px;object-fit:contain;display:block;margin:0 auto 8px}
.num{font-weight:800;color:#f1d16a;margin-bottom:8px}
.download{display:block;text-decoration:none;background:linear-gradient(#d9b13c,#8f6d14);color:#080808;font-weight:800;padding:9px 8px;border-radius:9px}
.note{margin-top:20px;color:#aaa;font-size:12px;line-height:1.7}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
<div class="wrap">
<h1>かずぽん 番号シール</h1>
<p class="sub">必要な番号を選んでダウンロードしてください。</p>
<a class="all-download" href="kazupon-number-1-160.zip" download>1〜160 全部まとめてダウンロード</a>
<div class="controls">
<input id="search" inputmode="numeric" placeholder="番号を入力（例：128）">
<button data-range="all">すべて</button>
<button data-range="1">1桁</button>
<button data-range="2">2桁</button>
<button data-range="3">3桁</button>
</div>
</div>
</header>
<main>
<div class="grid" id="grid"></div>
<div class="note">※「全部まとめてダウンロード」はZIP形式です。個別ボタンでは、その番号のPNG画像だけ保存できます。</div>
</main>
<script>
const grid=document.getElementById('grid');
const search=document.getElementById('search');
let activeRange='all';
for(let n=1;n<=160;n++){
 const digits=String(n).length;
 const card=document.createElement('div');
 card.className='card'; card.dataset.num=n; card.dataset.digits=digits;
 card.innerHTML=`<img src="${n}.png" alt="番号 ${n}"><div class="num">No. ${n}</div><a class="download" href="${n}.png" download="kazupon-number-${n}.png">ダウンロード</a>`;
 grid.appendChild(card);
}
function applyFilter(){
 const q=search.value.trim();
 document.querySelectorAll('.card').forEach(card=>{
  const ok=(!q||card.dataset.num.includes(q))&&(activeRange==='all'||card.dataset.digits===activeRange);
  card.classList.toggle('hidden',!ok);
 });
}
search.addEventListener('input',applyFilter);
document.querySelectorAll('button[data-range]').forEach(btn=>btn.addEventListener('click',()=>{activeRange=btn.dataset.range;applyFilter();}));
</script>
</body>
</html>
