<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>かずぽん 番号シール ダウンロード</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(9,9,9,.97);border-bottom:1px solid #5f4810;padding:14px}
.wrap,.grid{max-width:1100px;margin:auto}h1{margin:0 0 6px;color:#f2c84b;font-size:clamp(22px,5vw,34px)}
p{margin:0 0 10px;color:#ccc}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.action{border:0;border-radius:10px;padding:12px 8px;font-weight:900;font-size:14px;text-align:center;text-decoration:none;cursor:pointer}
.gold{background:linear-gradient(#f2d16c,#9a7416);color:#080808}.dark{background:#202020;color:#f2d16c;border:1px solid #695219}
.controls{display:flex;gap:7px;flex-wrap:wrap}input{flex:1 1 170px;padding:10px;border-radius:9px;border:1px solid #65501b;background:#151515;color:white;font-size:16px}
.filter{padding:9px 11px;border-radius:9px;border:1px solid #65501b;background:#171717;color:#f4d56a;font-weight:700}
.status{margin-top:9px;color:#f2d16c;font-weight:800}
main{padding:15px 12px 40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.card{position:relative;background:#111;border:2px solid #292929;border-radius:13px;padding:8px;text-align:center;cursor:pointer;user-select:none}
.card.selected{border-color:#f2c84b;box-shadow:0 0 0 2px rgba(242,200,75,.2)}
.check{position:absolute;right:7px;top:7px;width:25px;height:25px;border-radius:50%;background:#222;border:2px solid #80661d;display:grid;place-items:center;font-weight:900}
.selected .check{background:#e1b63b;color:#090909}
.card img{width:100%;height:80px;object-fit:contain;display:block;margin:4px auto 5px}.num{font-weight:800;color:#f1d16a}
.single{display:block;margin-top:6px;padding:7px 4px;border-radius:8px;background:#6f5515;color:#fff;text-decoration:none;font-size:12px;font-weight:800}
.hidden{display:none!important}
@media(max-width:500px){.actions{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>かずぽん 番号シール</h1>
<p>欲しい番号をタップして複数選択できます。</p>
<div class="actions">
<button id="selectedDownload" class="action gold">選んだ番号をまとめてダウンロード</button>
<a class="action dark" href="kazupon-number-1-160.zip" download>1〜160 全部ダウンロード</a>
</div>
<div class="controls">
<input id="search" inputmode="numeric" placeholder="番号検索（例：128）">
<button class="filter" data-range="all">すべて</button><button class="filter" data-range="1">1桁</button><button class="filter" data-range="2">2桁</button><button class="filter" data-range="3">3桁</button>
<button class="filter" id="clear">選択解除</button>
</div>
<div class="status" id="status">0個選択中</div>
</div></header>
<main><div class="grid" id="grid"></div></main>

<script>
const grid=document.getElementById('grid'), search=document.getElementById('search'), status=document.getElementById('status');
const selected=new Set(); let activeRange='all';

for(let n=1;n<=160;n++){
 const card=document.createElement('div'); card.className='card'; card.dataset.num=n; card.dataset.digits=String(n).length;
 card.innerHTML=`<span class="check">✓</span><img src="${n}.png" alt="${n}"><div class="num">No. ${n}</div><a class="single" href="${n}.png" download="kazupon-number-${n}.png">この番号だけ保存</a>`;
 card.addEventListener('click',e=>{
   if(e.target.closest('.single')) return;
   selected.has(n)?selected.delete(n):selected.add(n);
   card.classList.toggle('selected',selected.has(n)); update();
 });
 grid.appendChild(card);
}
function update(){status.textContent=`${selected.size}個選択中`;}
function filter(){
 const q=search.value.trim();
 document.querySelectorAll('.card').forEach(c=>{
  const ok=(!q||c.dataset.num.includes(q))&&(activeRange==='all'||c.dataset.digits===activeRange);
  c.classList.toggle('hidden',!ok);
 });
}
search.addEventListener('input',filter);
document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{activeRange=b.dataset.range;filter();});
document.getElementById('clear').onclick=()=>{selected.clear();document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));update();};

document.getElementById('selectedDownload').onclick=async()=>{
 if(!selected.size){alert('番号を選んでください');return;}
 const nums=[...selected].sort((a,b)=>a-b);
 // Browser security means a static page cannot build a ZIP without a library/server.
 // Download each selected PNG from one button, sequentially.
 for(const n of nums){
   const a=document.createElement('a'); a.href=`${n}.png`; a.download=`kazupon-number-${n}.png`;
   document.body.appendChild(a); a.click(); a.remove();
   await new Promise(r=>setTimeout(r,180));
 }
};
</script>
</body></html>
