<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>かずぽんバトルカード｜持ち物データ</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--text:#f0f6fc;--muted:#8b949e;--accent:#f2c94c}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#111827,#0d1117 45%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 50px}
.brand{text-align:center;font-weight:900;font-size:14px;letter-spacing:.08em;color:#d1d5db;margin:4px 0 16px}
.card{background:rgba(22,27,34,.97);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.head{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.id{font-size:13px;color:var(--accent);font-weight:800}
h1{font-size:30px;margin:5px 0 4px;line-height:1.25}
.sub{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr}
.item{padding:15px 18px;border-bottom:1px solid var(--line)}
.item:nth-child(odd){border-right:1px solid var(--line)}
.label{font-size:12px;color:var(--muted);margin-bottom:5px}
.value{font-size:17px;font-weight:800;word-break:break-word}
.full{grid-column:1/-1;border-right:0!important}
.desc{line-height:1.7;font-weight:600}
.msg{padding:30px 20px;text-align:center;color:var(--muted)}
@media(max-width:520px){h1{font-size:26px}.grid{grid-template-columns:1fr}.item,.item:nth-child(odd){border-right:0}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">KAZUPON BATTLE CARD</div>
  <div id="app" class="card"><div class="msg">持ち物データを読み込んでいます…</div></div>
</div>
<script>
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], nx=text[i+1];
    if(ch=='"'){
      if(q && nx=='"'){cell+='"';i++;}
      else q=!q;
    } else if(ch==',' && !q){row.push(cell);cell='';}
    else if((ch=='\n'||ch=='\r') && !q){
      if(ch=='\r' && nx=='\n') i++;
      row.push(cell); cell='';
      if(row.some(v=>v!=='')) rows.push(row);
      row=[];
    } else cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}

(async()=>{
  try{
    const id = new URLSearchParams(location.search).get("id");
    if(!id){app.innerHTML='<div class="msg">持ち物IDが指定されていません。</div>';return;}
    const res = await fetch("items.csv?v="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("items.csv");
    const text = (await res.text()).replace(/^\uFEFF/,'');
    const data = parseCSV(text);
    const h = data[0];
    const objs = data.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])));
    const idKey = h.find(k => String(k).includes("ID")) || "持ち物ID";
    const nameKey = h.find(k => String(k).includes("持ち物名")) || "持ち物名";
    const noKey = h.find(k => String(k).includes("図鑑No")) || "図鑑No";
    const m = objs.find(x => String(x[idKey]).trim()===id.trim());
    if(!m){app.innerHTML=`<div class="msg">${esc(id)} の持ち物データが見つかりません。</div>`;return;}

    const candidates = [
      "効果分類","対象","効果内容","継続","発動条件","使用回数","詳細説明"
    ];
    const fields = candidates.filter(k=>h.includes(k));

    app.innerHTML = `
      <div class="head">
        <div class="id">${esc(m[idKey])}</div>
        <h1>${esc(m[nameKey])}</h1>
        <div class="sub">図鑑No. ${esc(m[noKey] || "")}</div>
      </div>
      <div class="grid">
        ${fields.map(k=>`<div class="item ${k==="効果内容"||k==="詳細説明"?"full":""}"><div class="label">${esc(k)}</div><div class="value ${k==="効果内容"||k==="詳細説明"?"desc":""}">${esc(m[k] || "―")}</div></div>`).join("")}
      </div>`;
  }catch(e){
    app.innerHTML='<div class="msg">持ち物データの読み込みに失敗しました。</div>';
  }
})();
</script>
</body>
</html>
