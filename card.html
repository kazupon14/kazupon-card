<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZUPON CARD</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    .card {
      max-width: 460px;
      margin: 0 auto;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    .card img {
      width: 100%;
      display: block;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .name {
      font-size: 27px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 5px;
    }

    .id {
      text-align: center;
      color: #777;
      margin-bottom: 18px;
    }

    .status {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status-box {
      background: #f2f2f2;
      border-radius: 10px;
      padding: 11px;
      text-align: center;
    }

    .status-box strong {
      font-size: 13px;
      color: #666;
    }

    .status-box span {
      display: block;
      margin-top: 4px;
      font-size: 19px;
      font-weight: bold;
    }

    .intro {
      margin-top: 18px;
      background: #fff8dc;
      border-radius: 10px;
      padding: 15px;
      line-height: 1.7;
    }

    .intro-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .error {
      text-align: center;
      padding: 40px 10px;
    }
  </style>
</head>

<body>

<div class="card" id="card">
  読み込み中...
</div>

<script>

  const params = new URLSearchParams(window.location.search);
  const kz = params.get("id");

  // CSVを正しく分解
  function parseCSV(text) {
    const rows = [];
    let row = [];
    let value = "";
    let quoted = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      const next = text[i + 1];

      if (c === '"' && quoted && next === '"') {
        value += '"';
        i++;
      }
      else if (c === '"') {
        quoted = !quoted;
      }
      else if (c === ',' && !quoted) {
        row.push(value);
        value = "";
      }
      else if ((c === '\n' || c === '\r') && !quoted) {

        if (c === '\r' && next === '\n') {
          i++;
        }

        row.push(value);

        if (row.some(cell => cell !== "")) {
          rows.push(row);
        }

        row = [];
        value = "";
      }
      else {
        value += c;
      }
    }

    if (value !== "" || row.length > 0) {
      row.push(value);
      rows.push(row);
    }

    return rows;
  }

  fetch("cards.csv")
    .then(response => {

      if (!response.ok) {
        throw new Error("CSV読み込みエラー");
      }

      return response.text();
    })

    .then(text => {

      const rows = parseCSV(text);

      const headers = rows[0].map(h =>
        h.replace(/^\uFEFF/, "").trim()
      );

      const getIndex = name =>
        headers.findIndex(h => h === name);

      const noIndex = getIndex("図鑑No");
      const nameIndex = getIndex("キャラ名");
      const typeIndex = getIndex("属性");
      const rarityIndex = getIndex("レアリティ");
      const attackIndex = getIndex("攻撃力");
      const defenseIndex = getIndex("防御力");
      const speedIndex = getIndex("素早さ");
      const hpIndex = getIndex("生命力");
      const totalIndex = getIndex("総合値");
      const idIndex = getIndex("カードID");
      const introIndex = getIndex("紹介");

      const target = rows.slice(1).find(row =>
        row[idIndex] &&
        row[idIndex].trim().toUpperCase() === kz?.trim().toUpperCase()
      );

      if (!kz || !target) {
        document.getElementById("card").innerHTML =
          '<div class="error">カードが見つかりませんでした。</div>';
        return;
      }

      document.getElementById("card").innerHTML = `

        <img
          src="${kz}.png"
          alt="${target[nameIndex] || kz}"
        >

        <div class="name">
          ${target[nameIndex] || "名称未登録"}
        </div>

        <div class="id">
          ${kz}
        </div>

        <div class="status">

          <div class="status-box">
            <strong>図鑑No</strong>
            <span>${target[noIndex] || "-"}</span>
          </div>

          <div class="status-box">
            <strong>レアリティ</strong>
            <span>${target[rarityIndex] || "-"}</span>
          </div>

          <div class="status-box">
            <strong>属性</strong>
            <span>${target[typeIndex] || "-"}</span>
          </div>

          <div class="status-box">
            <strong>攻撃力</strong>
            <span>${target[attackIndex] || "-"}</span>
          </div>

          <div class="status-box">
            <strong>防御力</strong>
            <span>${target[defenseIndex] || "-"}</span>
          </div>

          <div class="status-box">
            <strong>素早さ</strong>
            <span>${target[speedIndex] || "-"}</span>
          </div>

          <div class="status-box">
            <strong>生命力</strong>
            <span>${target[hpIndex] || "-"}</span>
          </div>

          <div class="status-box">
            <strong>総合値</strong>
            <span>${target[totalIndex] || "-"}</span>
          </div>

        </div>

        <div class="intro">
          <div class="intro-title">紹介</div>
          ${target[introIndex] || "紹介文はまだ登録されていません。"}
        </div>

      `;

    })

    .catch(error => {

      document.getElementById("card").innerHTML =
        '<div class="error">カードデータの読み込みに失敗しました。</div>';

      console.error(error);

    });

</script>

</body>
</html>
