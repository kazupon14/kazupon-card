<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZUPON CARD</title>
</head>

<body>

  <img id="cardImage" style="max-width:300px; width:100%;">

  <h1>KAZUPON CARD</h1>
  <h2 id="cardId"></h2>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (id) {
      document.getElementById("cardImage").src = id + ".png";
      document.getElementById("cardId").textContent = "カードID：" + id;
    } else {
      document.getElementById("cardId").textContent = "カードIDがありません";
    }
  </script>

</body>
</html>
