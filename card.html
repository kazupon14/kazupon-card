<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZUPON CARD</title>

  <style>
    #cardImage {
      max-width: 300px;
      width: 100%;
      animation: sway 2s ease-in-out infinite alternate;
    }

    @keyframes sway {
      from {
        transform: translateX(-20px);
      }

      to {
        transform: translateX(20px);
      }
    }
  </style>
</head>

<body>

  <img id="cardImage">

  <h1>KAZUPON CARD</h1>

  <h2 id="cardId"></h2>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (id) {
      document.getElementById("cardImage").src = "images/" + id + ".png";
      document.getElementById("cardId").textContent = "カードID：" + id;
    } else {
      document.getElementById("cardId").textContent = "カードIDがありません";
    }
  </script>

</body>
</html>
